<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Music note 1 -->
  <g transform="translate(180, 160)">
    <ellipse cx="60" cy="140" rx="45" ry="35" fill="url(#note)" opacity="0.95"/>
    <rect x="80" y="40" width="18" height="140" rx="9" fill="url(#note)" opacity="0.95"/>
  </g>
  
  <!-- Music note 2 -->
  <g transform="translate(260, 200)">
    <ellipse cx="50" cy="120" rx="40" ry="30" fill="url(#note)" opacity="0.8"/>
    <rect x="70" y="40" width="16" height="120" rx="8" fill="url(#note)" opacity="0.8"/>
  </g>
  
  <!-- Sound waves -->
  <path d="M 120 380 Q 180 360 200 380 Q 220 400 280 380 Q 340 360 360 380" 
        stroke="white" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 140 410 Q 190 390 210 410 Q 230 430 270 410 Q 310 390 330 410" 
        stroke="white" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
