[package]
name = "music-tool-v2"
version = "1.0.0"
description = "音乐工具 - 歌词下载、格式转换、元数据编辑"
authors = ["you"]
edition = "2021"

[[bin]]
name = "music-tool-v2"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
which = "6"
ureq = { version = "2", features = ["json"] }
encoding_rs = "0.8"
